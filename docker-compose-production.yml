services:
  nodeserver_production:
    restart: always
    env_file:
      - .env
    build:
      context: .
      target: ${TARGET:-staging}
    image: "${DOCKER_IMAGE_NAME}"
    # Loopback only: nginx on the host is the public entry.
    ports:
      - "127.0.0.1:${NODE_PORT_EXTERNAL_PRODUCTION}:3000"
    environment:
      NODE_ENV: production
      ORIGIN: ${ORIGIN}
# Per-worker vhost for the BDD suite: w0.dev.medica.im … wN.dev.medica.im
#
# Why this exists
# ---------------
# Playwright runs ~4 workers in parallel against one dataset, and the backend
# resolves which Site a request belongs to from the request *hostname*
# (get_site_from_request in api/utils.py). One hostname therefore meant one
# shared Site, so every worker mutated the same rows: a scenario restricting an
# avatar and a sibling resetting it collided, and clearApiCache() — which
# flushes Redis globally — let one worker drop another's payload between its
# write and its read. Those were papered over with @mode:serial, worker-scoped
# seed tags and per-scenario cloning; none of it removes the shared resource.
#
# Giving each worker its own hostname gives it its own Site, Directory,
# Organization and entries, so there is nothing left to contend over.
#
# Install
# -------
#   sudo ln -s /home/elkcloner/git/clinic-cms/skcms/scripts/nginx/e2e-workers.conf \
#              /etc/nginx/sites-enabled/e2e-workers
#   sudo nginx -t && sudo systemctl reload nginx
#
# /etc/hosts must resolve the names (already done):
#   127.0.0.1 w0.dev.medica.im w1.dev.medica.im w2.dev.medica.im w3.dev.medica.im
#
# TLS matters here beyond realism: Auth.js derives the session-cookie *name*
# and its encryption *salt* from whether the request looks like https, and the
# backend's fastapi_nextauth_jwt derives the same salt independently. Serve
# these hostnames over plain http and every authenticated scenario 401s — see
# project-auth-url-scheme-cookie-name and project-bdd-runs-through-nginx.
#
# The certificate is a genuine wildcard (see ssl_certificate below), so nothing
# has to ignore certificate errors.
#
# DNS: wN.dev.medica.im resolve through /etc/hosts to 127.0.0.1 — no public A
# records, since Playwright, nginx and Vite all run on this box. Only the
# short-lived _acme-challenge TXT record is public, and the certbot plugin
# creates and removes that itself.
#
# One regex server_name rather than a block per worker, so raising the worker
# count needs no nginx change. Mirrors the dev.sante-gadagne.fr vhost otherwise,
# including the shared upstreams from conf.d/00-upstreams.conf.

server {
	server_name ~^w\d+\.dev\.medica\.im$;

	proxy_buffer_size   128k;
	proxy_buffers   4 256k;
	proxy_busy_buffers_size   256k;
	client_max_body_size 100M;

	location / {
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Tells SvelteKit the original request was HTTPS even though Vite is
		# reached over plain HTTP — see trustForwardedProto in hooks.server.ts.
		proxy_set_header X-Forwarded-Proto https;
		proxy_pass http://127.0.0.1:3000/;
		proxy_read_timeout 300;
		proxy_connect_timeout 300;
		proxy_send_timeout 300;

		# Vite HMR / SvelteKit dev needs the websocket upgraded.
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location /media/ {
		autoindex on;
		alias /srv/dev.medica.im/media/;
	}

	location ^~ /static {
		autoindex on;
		alias /srv/dev.medica.im/static;
	}

	location ^~ /api/v2/ {
		proxy_pass http://uvicorn/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}

	location ~ (/admin/|/api/v1/) {
		proxy_pass http://django;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_redirect default;
		proxy_connect_timeout   300;
		proxy_send_timeout      300;
		proxy_read_timeout      300;
		send_timeout 300;
		client_body_timeout 300;
		fastcgi_read_timeout 300;
	}

	listen 443 ssl;
	listen [::]:443 ssl;
	# Wildcard covering every wN.dev.medica.im, issued via the DNS-01 challenge
	# against DigitalOcean (medica.im is on their nameservers):
	#
	#   sudo certbot certonly --dns-digitalocean \
	#     --dns-digitalocean-credentials /etc/letsencrypt/secrets/digitalocean.ini \
	#     -d '*.dev.medica.im' -d 'dev.medica.im' \
	#     --cert-name dev.medica.im-wildcard
	#
	# A real certificate rather than a self-signed one, so the browser validates
	# the chain normally and Playwright needs no ignoreHTTPSErrors. Renewal is
	# unattended (the credentials file above is referenced by the renewal
	# config — moving it silently breaks renewal).
	ssl_certificate /etc/letsencrypt/live/dev.medica.im-wildcard/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/dev.medica.im-wildcard/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Which dev server port serves each dev.<site> hostname.
#
# Why a port per site
# -------------------
# One Vite instance can only render one site: the app resolves its API origin at
# build time from PUBLIC_ORIGIN (src/lib/utils/origin.ts), so a server started
# for gadagne renders gadagne no matter which hostname the browser used. While
# every dev.<site> proxied to a single :3000, only the site that server was
# started for worked — dev.santelyon3.fr answered 403 while :3000 was on
# gadagne, and the `sites` Playwright project failed all 11 of its Lyon 3 specs
# against a site that was never being served.
#
# Same reasoning as the per-worker map in e2e-workers.conf, and the two port
# ranges are deliberately disjoint: 3010-3019 here, 3100+ there.
#
# Install
# -------
#   sudo ln -s /home/elkcloner/git/clinic-cms/skcms/scripts/nginx/dev-site-ports.conf \
#              /etc/nginx/conf.d/10-dev-site-ports.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# conf.d rather than sites-enabled: this defines no server block, only a map,
# and nginx.conf includes conf.d/*.conf before sites-enabled/*, so $dev_site_port
# is already defined by the time a vhost uses it.
#
# The vhosts themselves stay in /etc/nginx/sites-available: certbot owns them
# (it finds blocks by server_name and rewrites the listen/ssl_* lines on
# renewal), so they are not moved into the repo. Each one's app proxy becomes:
#
#   proxy_pass http://127.0.0.1:$dev_site_port;
#
# which is the only edit they need, and one that certbot does not touch.
#
# Keep the rows in step with the `port:` values in dev.yml — that file is what
# scripts/dev.sh reads when it starts a server.

map $host $dev_site_port {
	# An unmapped hostname gets a port nothing listens on, so a missing row
	# fails loudly (502) instead of silently serving whichever site happens to
	# be up on another port.
	default                 3019;
	dev.annuaire.medica.im  3010;
	dev.santelyon3.fr       3011;
	dev.sante-gadagne.fr    3012;
	dev.ipa.medica.im       3013;
	dev.sandbox.medica.im   3014;
}

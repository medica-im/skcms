# Each dev.<site> again, on 127.0.0.2:443, for test-all's Playwright.
#
# Why
# ---
# test-all runs its own server for every site (scripts/test-all.sh,
# ensure_all_site_servers) so its `sites` specs test the snapshot it was
# started on, while the developer's dev server keeps serving dev.<site> from
# the working tree. Both answer to the same hostname: the app is tied to it
# (the backend reads the tenant from the Host, the session cookie and
# PUBLIC_ORIGIN are bound to the origin), so a second name would mean a second
# site to configure everywhere.
#
# So the name stays and the address differs: a second loopback address, on the
# usual port. test-all's Playwright resolves each dev.<site> to it (SITES_VIA) —
# Chromium through --host-resolver-rules (playwright.config.ts), the specs' own
# requests through scripts/sites-dns.cjs. The page is still https://dev.<site>,
# but the connection lands here and is handed to the site's vhost marked as
# test-all's. Only the vhost's app proxy reads the mark, choosing the test port.
#
# An address rather than a port, because a lookup is all Node lets a preload
# change: the specs' requests have to follow the browser, and a port cannot be
# redirected from outside the code that opens the connection.
#
# Loopback only: nothing off this machine can reach a test server. The
# vhosts' own wildcard :443 still answers on 127.0.0.2 for any name not listed
# here, so every response from here says so (X-Dev-Site-Test), and test-all
# checks for it before trusting the route.
#
# Install
# -------
#   sudo ln -s /home/elkcloner/git/clinic-cms/skcms/scripts/nginx/dev-site-test.conf \
#              /etc/nginx/sites-enabled/dev-site-test
#   sudo nginx -t && sudo systemctl reload nginx
#
# A site added to dev-site-ports.conf needs a block here too, with its own
# certificate.

server {
	listen 127.0.0.2:443 ssl;
	server_name dev.annuaire.medica.im;
	ssl_certificate /etc/letsencrypt/live/dev.annuaire.medica.im/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/dev.annuaire.medica.im/privkey.pem;
	include /home/elkcloner/git/clinic-cms/skcms/scripts/nginx/dev-site-test-proxy.inc;
}


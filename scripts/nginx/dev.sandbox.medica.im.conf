# Dev vhost for dev.sandbox.medica.im, same pattern as dev.annuaire.medica.im.
#
# Plain :80, no TLS yet — `certbot --nginx` adds the 443 block, the
# ssl_certificate lines and the :80 -> :443 redirect on top of this. Leave the
# `server_name` and the .well-known location alone: the installer finds this
# block by server_name, and the ACME http-01 challenge is served from here.
#
# Reuses the `uvicorn` and `django` upstreams already defined in
# /etc/nginx/conf.d/00-upstreams.conf rather than redefining them here, since
# nginx errors on a duplicate upstream name.
#
# Install
# -------
#   sudo ln -s /home/elkcloner/git/clinic-cms/skcms/scripts/nginx/dev.sandbox.medica.im.conf \
#              /etc/nginx/sites-enabled/dev.sandbox.medica.im
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dev.sandbox.medica.im
#
# Requires scripts/nginx/dev-site-ports.conf to be installed as well — that is
# where $dev_site_port comes from (dev.sandbox.medica.im -> 3014, matching the
# `port:` in dev.yml). Without it nginx fails to start on an unknown variable.
#
# Note on certbot rewriting a repo-owned file
# -------------------------------------------
# certbot edits this file in place, so after the run the working tree shows its
# additions. Commit them: they are the real configuration. (The other per-site
# vhosts live in /etc/nginx/sites-available for exactly this reason; keeping
# this one in the repo trades that for reviewability, which is why the certbot
# additions must be committed rather than reverted.)
#
# Certificate
# -----------
# This host needs its OWN certificate. The existing dev.medica.im-wildcard does
# NOT cover it: a wildcard matches exactly one label, so *.dev.medica.im covers
# w0.dev.medica.im and sandbox.dev.medica.im — but dev.sandbox.medica.im puts
# "sandbox" in the second position, making it a subdomain of sandbox.medica.im,
# a different zone. OpenSSL rejects the pairing outright:
#
#   openssl s_client -connect 127.0.0.1:443 -servername w0.dev.medica.im \
#     -verify_hostname dev.sandbox.medica.im
#   => verify error:num=62:hostname mismatch
#
# http-01 works because the name is publicly resolvable to this box
# (159.195.215.52 / 2a0a:4cc0:c4:600:487c:bfff:fe37:b7d9). /etc/hosts also pins
# it to 127.0.0.1, but that affects only this machine, not Let's Encrypt's
# validators.
#
# dns-01 is the alternative, matching how the wildcard is issued (medica.im is
# on DigitalOcean nameservers):
#
#   sudo certbot certonly --dns-digitalocean \
#     --dns-digitalocean-credentials /etc/letsencrypt/secrets/digitalocean.ini \
#     -d dev.sandbox.medica.im

server {

	server_name dev.sandbox.medica.im;

	proxy_buffer_size   128k;
	proxy_buffers   4 256k;
	proxy_busy_buffers_size   256k;
	client_max_body_size 100M;

	location / {
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# $scheme rather than a hardcoded https: before certbot runs this vhost
		# is genuinely http, and Auth.js derives the session-cookie name *and*
		# its salt from whether the request looks secure — as does the backend's
		# fastapi_nextauth_jwt, independently. Claiming https too early makes
		# every authenticated request 401. certbot's redirect sends real traffic
		# through the 443 block once the certificate exists, where $scheme is
		# https on its own.
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://127.0.0.1:$dev_site_port;
		proxy_read_timeout 300;
		proxy_connect_timeout 300;
		proxy_send_timeout 300;

		# Vite HMR / SvelteKit dev needs the websocket upgraded.
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	# The ACME http-01 challenge. Served over plain :80 and never redirected,
	# so it keeps working after certbot adds its :80 -> :443 redirect.
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location /media/ {
		autoindex on;
		alias /srv/dev.medica.im/media/;
	}

	location ^~ /static {
		autoindex on;
		alias /srv/dev.medica.im/static;
	}

	location ^~ /api/v2/ {
		proxy_pass http://uvicorn/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ~ (/admin/|/api/v1/) {
		proxy_pass http://django;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_redirect default;
		proxy_connect_timeout   300;
		proxy_send_timeout      300;
		proxy_read_timeout      300;
		send_timeout 300;
		client_body_timeout 300;
		fastcgi_read_timeout 300;
	}

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dev.sandbox.medica.im/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev.sandbox.medica.im/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = dev.sandbox.medica.im) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



	server_name dev.sandbox.medica.im;

	listen 80;
	listen [::]:80;
    return 404; # managed by Certbot


}
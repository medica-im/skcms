# svelte-check error baselines, one per site. Sourced by
# scripts/typecheck-baseline-of.sh; read by test-all.sh and the pre-push hook.
#
# The codebase carries a backlog of pre-existing svelte-check errors, so the
# typecheck suite fails on the *count* rising above a baseline rather than on
# any error at all. Lower these as the backlog is paid down.
#
# One baseline per site, because the count is a property of the site and not of
# the parent code. Each context checks out its own skvar branch, and the routes
# under (skvar) are typechecked with everything else — so the same parent commit
# measures a different number on each site. A single number cannot describe
# them all: set for the worst site it admits new errors on the best, and set for
# the best it fails the others on work nobody did.
#
# Measured, not guessed: a baseline above the real count admits that many new
# errors without failing. Re-measure with `scripts/typecheck-baselines.sh`,
# which prints exactly these lines; it does not write them here itself, because
# a baseline that rewrites itself records whatever the tree happened to contain,
# including regressions it was supposed to catch.
#
# Committed, not in a git-ignored env file: a local copy of these numbers once
# sat eight above the script's while the real count was below both, and the
# gate admitted new errors in silence.
#
# Measured 2026-10-27.
TYPECHECK_BASELINE_annuaire=117
TYPECHECK_BASELINE_lyon3=116
TYPECHECK_BASELINE_gadagne=122
TYPECHECK_BASELINE_vedene=114
TYPECHECK_BASELINE_sandbox=117
TYPECHECK_BASELINE_unipa=117
TYPECHECK_BASELINE_msp=110

# The fallback for a site with no line above — a new site added to dev.yml
# reaches this rather than silently typechecking against zero. Deliberately the
# highest of the measured numbers: a new site fails on being worse than the
# worst known, not on inheriting a stricter site's budget.
TYPECHECK_BASELINE_DEFAULT=122
